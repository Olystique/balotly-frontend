name: Olystique CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: App starts and serves the home page
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then echo "ok"; exit 0; fi
            sleep 1
          done
          echo "App did not start"; cat next.log; exit 1
